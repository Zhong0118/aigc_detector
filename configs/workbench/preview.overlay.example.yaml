# Isolated preview overlay. scripts/workbench_preview.py deep-merges it over config.yaml
# into <preview_dir>/config.yaml. ${RESEARCH_ROOT}, ${MAIN_ROOT}, ${PREVIEW_DIR} are expanded.
# No secrets here; the launcher also starts children with a clean environment (no API keys).
database:
  path: "${PREVIEW_DIR}/preview.db"

detection:
  demo_provider_enabled: false
  api_providers:          # nothing is uploaded to external services from the preview
    hive: {enabled: false}
    sightengine: {enabled: false}
  local_models:
    text_yuchuan:
      cache_dir: "${MAIN_ROOT}/models/huggingface"   # read-only, offline
      device: "cpu"

provenance:
  fingerprint_db_path: "${PREVIEW_DIR}/fingerprint_registry.db"
  attribution:
    text:
      providers:
        window_a0_equal_fusion:
          a0_model_dir: "${MAIN_ROOT}/outputs/attribution/family-window-split/A0-closed-seed42/model"
          a0_tokenizer_dir: "${MAIN_ROOT}/outputs/attribution/family-window-split/A0-closed-seed42/tokenizer"
          b0_model_path: "${MAIN_ROOT}/outputs/attribution/family-phase4/fast-track-v1/classical/closed-seed42/B0/model.joblib"
          b1_model_path: "${MAIN_ROOT}/outputs/attribution/family-phase4/fast-track-v1/classical/closed-seed42/B1/model.joblib"
          b3_model_path: "${MAIN_ROOT}/outputs/attribution/family-phase1/final/models/B3.joblib"
    image:
      enabled: false        # legacy image branches (pHash prototypes, scaffold) are never used

report:
  provider: "template"      # no LLM explanations in the preview

api:
  host: "127.0.0.1"
  port: 8611

dashboard:
  port: 8612

workbench:
  research_root: "${RESEARCH_ROOT}"
  device: "cpu"             # registered device policy: CPU only, GPUs hidden from the process
  torch_threads: 8
  max_pending: 2            # one running + one waiting; more requests get `busy`
  queue_timeout_seconds: 120
  # OFA on CPU differs from the registered GPU predictions by ~5e-4 (> its registered 1e-4
  # tolerance; see docs/workbench_preview/evidence/adapter_consistency.json): fail closed.
  research_ofa: false
  research_ofa_note: "cpu_reproduction_exceeds_registered_tolerance"
  limits: {max_bytes: 20971520, min_side: 32, max_side: 8192, max_pixels: 40000000}
  artifacts:
    openclip_config: {path: configs/image_experiments/iab_openclip_q179_20261029.json, sha256: c70712b654ec15239534a6b66e3fdfe4c7914ba1bf7a0bd906f947bb9e43a562}
    openclip_backbone: {path: outputs/image_experiments/assets/openclip-vit-l-14-openai/open_clip_model.safetensors, sha256: 9ce2e8a8ebfff3793d7d375ad6d3c35cb9aebf3de7ace0fc7308accab7cd207e}
    dopenclip_head: {path: outputs/image_experiments/openclip-q179-20261029/D-OpenCLIP/linear/head.pth, sha256: 0432c050a2c9afcb1845e31651586032e5672f0e4096713fdd4a9f0d64ea4bbb}
    dopenclip_provenance: {path: outputs/image_experiments/openclip-q179-20261029/D-OpenCLIP/provenance.json, sha256: 1be0094babb0fb93d44aeed361045b02bac4432764c0c78cb18e31832cf848b8}
    dopenclip_metrics: {path: outputs/image_experiments/openclip-q179-20261029/D-OpenCLIP/metrics.json, sha256: 3ec4ff0e0aa3912c3c4c874887c3fa7be981d22fb0e28f08f77e16adbda6ba49}
    a0_model: {path: outputs/image_experiments/a0-resnet50-iab-v7-200-q179-e30/model.pth, sha256: c3756dd56fbd3d151ebda8db69b683fd8c78cd773a9967af6e70a3565891562b}
    a0_asset_manifest: {path: outputs/image_experiments/a0-resnet50-iab-v7-200-q179-e30/asset_manifest.json, sha256: 16101f1d80a7b74e4fcac0d6883d3db745e7feaf8936a0c30a275dcf1291f4c2}
