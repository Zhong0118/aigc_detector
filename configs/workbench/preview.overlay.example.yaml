      - {id: research-omnidfa-k10, task: source_classification, label: "OmniDFA K10 原型", reason: online_adapter_not_implemented}
      - {id: research-openclip-source22, task: source_classification, label: "OpenCLIP 22 类线性头", reason: online_adapter_not_implemented}
      - {id: research-openclip-knn22, task: source_classification, label: "OpenCLIP KNN（k=1）", reason: online_adapter_not_implemented}
      - {id: research-rgb22, task: source_classification, label: "A-RGB（DINOv2 CLS）", reason: online_adapter_not_implemented}
      - {id: research-fingerprint22, task: source_classification, label: "A-FP（OFA 指纹）", reason: fingerprint_cpu_gpu_consistency_not_accepted}
      - {id: research-feature-fusion22, task: source_classification, label: "A-Fusion（RGB+FP 特征融合）", reason: fingerprint_cpu_gpu_consistency_not_accepted}
