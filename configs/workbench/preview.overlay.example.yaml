      fusion_summary: {label: "200-q179 score fusion summary", path: outputs/image_experiments/resnet-feature-score-fusion-iab-v7-200-q179-e30/summary.json, sha256: 7f9c605edfc680caedb82bfaed37326ddbe0f5e278e94c81b713bfc12f94e5fb}
      dopenclip_metrics: {label: "D-OpenCLIP metrics", path: outputs/image_experiments/openclip-q179-20261029/D-OpenCLIP/metrics.json, sha256: 3ec4ff0e0aa3912c3c4c874887c3fa7be981d22fb0e28f08f77e16adbda6ba49}
    routes:
