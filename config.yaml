database:
  path: "data/aigc_detection.db"

detection:
  mode: "api_first"
  threshold: 0.8
  deep_provenance_threshold: 0.6
  demo_provider_enabled: false
  text_false_positive_control:
    enabled: true
    dataset_profile: "multidomain"
    artifact_path: "artifacts/text_fp_controller/thresholds.json"
    target_fpr: 0.02
    default_low_threshold: 0.4
    default_high_threshold: 0.8
    min_effective_chars: 120
    short_text_chars: 200
    min_analyzed_coverage: 0.7
    min_high_coverage: 0.3
    min_adjacent_high_segments: 2
    min_group_calibration_humans: 50
    min_group_validation_humans: 50
    min_group_validation_ai: 50
    min_reliable_human_validation: 200
    min_reliable_ai_validation: 200
    min_acceptable_ai_recall: 0.7
    bootstrap_human_calibration_limit: 5000
    bootstrap_human_validation_limit: 1000
    bootstrap_ai_validation_limit: 1000
    # Compatibility aliases retained for existing deployment scripts.
    bootstrap_sample_limit: 5000
    bootstrap_validation_limit: 1000
    bootstrap_validation_fraction: 0.2
    bootstrap_sampling_seed: 20260722
    bootstrap_max_source_items: 500000
    bootstrap_max_windows_per_document: 1
    resource_sources:
      raid_adversarial:
        enabled: false
    # Product floors. Calibration may raise a group above these, but not past 0.99:
    # English YuChuan human scores hug 1.0, so a 2% FPR cut becomes 0.9996 and AI recall collapses.
    # artifacts/text_fp_controller/thresholds.json keeps calibrated_high_threshold and
    # runtime-caps those groups to the floors below.
    domain_thresholds:
      literature:
        low_threshold: 0.35
        high_threshold: 0.92
      academic_technical:
        low_threshold: 0.35
        high_threshold: 0.88
      official_news:
        low_threshold: 0.4
        high_threshold: 0.86
      general_qa:
        low_threshold: 0.4
        high_threshold: 0.8
  api_providers:
    hive:
      enabled: true
      api_version: "v3_vlm"
      api_key_env: "LJ9NfOyoJrxKgomS9kfvPQ=="
    sightengine:
      enabled: true
      api_user_env: "1813021110"
      api_secret_env: "YzYcSfvs93dSk7Quie7DgWpuvToZBmWJ"
  local_models:
    enabled: true
    text_yuchuan:
      enabled: true
      cache_dir: "models/huggingface"
      device: "auto"
      threshold: 0.8
      short_text_chars: 200
      max_length: 512
      mixed_strategy: "mean"
      models:
        zh_long: "yuchuantian/AIGC_detector_zhv3"
        zh_short: "yuchuantian/AIGC_detector_zhv3short"
        en_long: "yuchuantian/AIGC_detector_env3"
        en_short: "yuchuantian/AIGC_detector_env3short"
      # 中文 BERT 长/短模型都是 512 token。中文大约 1 字 ≈ 1 token，
      # 480/640 已经贴近上限，再加大只会被 tokenizer 截断。
      segment_target_chars: 480
      segment_max_chars: 640
      # 英文 RoBERTa 同样 512 token，但英文大约 4 字符 ≈ 1 token，
      # 原来的 480 字符窗口只用到了长模型大约四分之一容量。
      en_segment_target_chars: 1400
      en_segment_max_chars: 1800
      segment_overlap_sentences: 1
  text:
    model_name: "distilgpt2"
    threshold: 0.8
  image:
    model_name: "efficientnet_v2_s"
    threshold: 0.8
  audio:
    model_name: "yamnet"
    sample_rate: 16000
    threshold: 0.8
  video:
    frame_interval: 30
    threshold: 0.8
  fusion:
    method: "weighted_average"
    weights:
      text: 0.3
      image: 0.3
      audio: 0.2
      video: 0.2

provenance:
  fingerprint_db_path: "data/fingerprint_registry.db"
  c2pa:
    enabled: true
    mode: "local"
    tool_path: "tools/c2patool/c2patool.exe"
  watermark:
    enabled: true
    provider: "meta_seal"
    mode: "local"
    device: "auto"
    threshold: 0.5
    audio:
      enabled: true
      model: "audioseal_detector_16bits"
      cache_dir: "models/audioseal"
      sample_rate: 16000
      threshold: 0.5
    image:
      enabled: true
      provider: "videoseal"
      package_root: "third_party/videoseal"
      model: "videoseal"
      threshold: 0.5
    video:
      enabled: true
      provider: "videoseal"
      package_root: "third_party/videoseal"
      model: "videoseal"
      threshold: 0.5
      max_frames: 32
    text:
      enabled: false
      provider: "textseal"
      command: null
  attribution:
    enabled: true
    fusion:
      enabled: true
      top_k: 5
    text:
      enabled: true
      top_k: 5
      providers:
        window_a0_equal_fusion:
          enabled: true
          provider: "window_a0_equal_fusion"
          seed: 42
          control_seed: 62
          top_k: 5
          min_blocks: 8
          max_blocks: 12
          min_family_probability: 0.20
          a0_model_dir: "outputs/attribution/family-window-split/A0-closed-seed42/model"
          a0_tokenizer_dir: "outputs/attribution/family-window-split/A0-closed-seed42/tokenizer"
          b0_model_path: "outputs/attribution/family-phase4/fast-track-v1/classical/closed-seed42/B0/model.joblib"
          b1_model_path: "outputs/attribution/family-phase4/fast-track-v1/classical/closed-seed42/B1/model.joblib"
          b3_model_path: "outputs/attribution/family-phase1/final/models/B3.joblib"
          weights:
            A0: 0.30
            B0: 0.10
            B1: 0.05
            B3: 0.55
          note: "Official mix: window-split A0 seed42 + B0 + B1 + B3. Weights locked on frozen val (A0 0.30 / B0 0.10 / B1 0.05 / B3 0.55); test scored once. Seed 62 is control-only. Do not train A1–A4."
        trained_classifier:
          enabled: false
          provider: "trained_classifier"
          model_path: "models/attribution/text_source_classifier.joblib"
          top_k: 5
          note: "Legacy self-trained text source classifier. Disabled while the window-A0 fusion is the production text branch."
        llmdet:
          enabled: false
          provider: "llmdet"
          top_k: 5
          min_chars: 30
          cache_dir: "models/huggingface"
          shim_unilm: true
          load_probability: true
          timeout_seconds: 45
          expected_npz:
            - "gpt2"
            - "opt"
            - "unilm"
            - "llama"
            - "bart"
            - "t5"
            - "bloom"
            - "neo"
            - "vicuna"
            - "gpt2_large"
            - "opt_3b"
          note: "LLMDet is an experimental candidate-source attribution branch; it is not definitive proof."
        openturingbench:
          enabled: false
          provider: "openturingbench"
          mode: "prototype_dataset"
          dataset_name: "MLNTeam-Unical/OpenTuringBench"
          dataset_subset: "in_domain"
          dataset_split: "train"
          prototypes_path: "data/attribution/text/openturingbench_prototypes.jsonl"
          top_k: 5
          min_chars: 30
          note: "Build prototypes from OpenTuringBench before this branch becomes active."
        embedding_prototype:
          enabled: false
          provider: "embedding_prototype"
          prototypes_path: "data/attribution/text/custom_text_prototypes.jsonl"
          analyzer: "char_wb"
          ngram_range: [3, 5]
          max_features: 50000
          aggregate_top_n: 5
          top_k: 5
          min_chars: 30
          note: "Local text style/prototype branch; add your own labeled candidate-model samples."
    image:
      enabled: true
      top_k: 5
      providers:
        trained_classifier:
          enabled: true
          provider: "trained_classifier"
          model_path: "models/attribution/image_source_classifier.joblib"
          feature_type: "clip"
          clip_model_name: "openai/clip-vit-base-patch32"
          cache_dir: "models/huggingface"
          top_k: 5
          note: "Self-trained image source classifier. Train it with scripts/train_image_attribution.py."
        ofa_attribution:
          enabled: true
          provider: "ofa_attribution"
          command: null
          json_arg: true
          timeout_seconds: 180
          note: "Set command after preparing OFAAttribution inference weights/script."
        universal_attribution:
          enabled: true
          provider: "universal_attribution"
          command: null
          json_arg: true
          timeout_seconds: 180
          note: "Set command after cloning/configuring a UniversalAttribution JSON-output inference script."
        clip_prototype:
          enabled: true
          provider: "clip_prototype"
          feature: "phash"
          prototypes_path: "data/attribution/image/image_prototypes.jsonl"
          aggregate_top_n: 5
          top_k: 5
          note: "Local image prototype branch. It currently uses pHash unless command points to a CLIP/DINO script."
    audio:
      enabled: false
    video:
      enabled: true
      top_k: 5
      providers:
        frame_image_fusion:
          enabled: true
          provider: "frame_image_fusion"
          max_frames: 8
          frame_interval: 30
          top_k: 5
          note: "Sample video frames and reuse image attribution branches."
        saga:
          enabled: false
          provider: "saga"
          command: null
          json_arg: true
          timeout_seconds: 300
          note: "SAGA requires separate research implementation/training before inference."

report:
  provider: "llm"
  llm_provider: "deepseek"
  api_key_env: "sk-ccae2f2b91ea47f6944000b577d051a3"
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  thinking: "disabled"
  max_tokens: 300
  cache_enabled: true
  cache_dir: "data/report_cache"
api:
  host: "0.0.0.0"
  port: 8000

dashboard:
  port: 8501
